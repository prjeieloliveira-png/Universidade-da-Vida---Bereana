name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

# Evita deploys concorrentes caso haja commits rápidos em sequência
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🛠️ Compilar Projeto (Vite Build)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 🚀 Sincronizar Arquivos com Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/deploy-ftp.mjs
